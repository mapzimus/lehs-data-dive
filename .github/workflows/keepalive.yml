name: Keepalive — wake Streamlit Cloud (real browser)

# Streamlit Cloud's sleep policy is based on active WEBSOCKET SESSIONS, not
# HTTP traffic. A plain `curl` or `requests.get` returns the Zzzz sleep page
# with 200 OK but never wakes the app. We use Playwright + headless Chromium
# to actually open the page, click the wake button if needed, and hold the
# session long enough that Streamlit counts it as active traffic.
#
# Schedule: every 4 hours. Streamlit's exact sleep threshold isn't documented
# but is typically ~12 hours of session inactivity. 4h gives generous margin.
#
# Cost: 6 runs/day × ~90s × 31 days ≈ 280 GH Actions minutes/month, well
# under the 2,000-min free quota for public repos.

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4h at :23
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Wake + hold session
        run: python scripts/keepalive_ping.py

      - name: Upload screenshot for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-screenshot-${{ github.run_id }}
          path: keepalive-last.png
          if-no-files-found: ignore
          retention-days: 7
