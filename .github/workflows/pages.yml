name: Deploy Lynn Maps to GitHub Pages

# Deploys the maps/ subdirectory only — the rest of this repo is the
# Streamlit data pipeline and dashboard, served separately at
# lynn-data-dive.streamlit.app.

on:
  push:
    branches: [main]
    paths:
      - "maps/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: maps
      - id: deployment
        uses: actions/deploy-pages@v4
