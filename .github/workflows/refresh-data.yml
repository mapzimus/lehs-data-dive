name: Refresh data (semi-annual)

# Runs at 07:00 UTC on the 1st of January and the 1st of July, plus on-demand
# via the "Run workflow" button in the Actions tab.
#
# What it does:
#   1. Sets up Python 3.12 with the project deps
#   2. Runs scripts/refresh_all.py end-to-end
#   3. If any files under data/processed/ changed, opens a PR
#
# Required repo secret:
#   CENSUS_API_KEY — set under Settings → Secrets and variables → Actions
#   (the Census ACS download step in scripts/10_download_census_acs.py needs it)

on:
  schedule:
    - cron: "0 7 1 1,7 *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps for geopandas
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full refresh pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          COLLEGE_SCORECARD_KEY: ${{ secrets.COLLEGE_SCORECARD_KEY }}
        run: python scripts/refresh_all.py

      - name: Sync refreshed GeoJSONs into maps/data/
        # maps/ is the dev home of the Lynn map. The PUBLIC copy is served
        # from the maxwellhowegis repo (Lynn-data-dive/maps/) — after merging
        # a refresh PR, run deploy/sync_public_maps.ps1 locally to publish
        # the new GeoJSONs there.
        run: |
          mkdir -p maps/data
          for f in data/processed/lynn_schools.geojson \
                   data/processed/lynn_town.geojson \
                   data/processed/lynn_tracts.geojson \
                   data/processed/ma_academic_districts.geojson \
                   data/processed/ma_districts_metrics.geojson \
                   data/processed/ma_municipalities.geojson \
                   data/processed/ma_public_schools.geojson; do
            if [ -f "$f" ]; then
              cp "$f" "maps/data/$(basename "$f")"
              echo "synced $f -> maps/data/"
            fi
          done

      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Data refresh ${{ github.run_id }}"
          branch: data-refresh/${{ github.run_id }}
          title: "Semi-annual data refresh"
          body: |
            Automated refresh of every parquet + geojson under `data/processed/`,
            with the map-facing GeoJSONs synced into `maps/data/`.

            Triggered by `.github/workflows/refresh-data.yml` (cron: every 6 months,
            or manual). Review the file changes — if numbers shifted in a way that
            looks wrong, close this PR and investigate the underlying script.

            After merge: Streamlit Cloud redeploys the dashboard automatically.
            The PUBLIC map copies (maxwellhowegis.com/Lynn-data-dive/maps/ and
            /ma-atlas/) do NOT update on their own — run
            `deploy/sync_public_maps.ps1` locally, review the diff in the
            maxwellhowegis clone, commit, push.
          add-paths: |
            data/processed/**
            maps/data/**
            reports/**
