# ---------------------------------------------------------------------------
# Brief school-history sidebar — non-athletic but anchoring context.
# ---------------------------------------------------------------------------
school_history: |
  Lynn English opened in **1892** on Essex Street. The original building
  was destroyed by fire on **March 29, 1924**, killing one firefighter.
  The current building on Goodridge Street opened in **1931** at a cost
  of $1.8M — a Classical Revival design with the Lincoln Foyer (statue
  donated by the class of 1934) at its main entrance. In the late
  20th century, alumni rallied 2,000+ strong in a parade to defeat a
  proposal to rename the school *Eastern Senior High* — the LEHS name
  survives.

# ---------------------------------------------------------------------------
# The Lynn English / Lynn Classical Thanksgiving rivalry.
# A century-old institution that deserves its own section.
# ---------------------------------------------------------------------------
rivalry:
  opponent: "Lynn Classical Rams"
  sport: "Football"
  tradition: "Thanksgiving Day"
  started: 1911
  all_time_series: "Lynn Classical leads 53-37-9 (as of 2013)"
  most_recent: "Lynn English 36, Lynn Classical 12 (Thanksgiving 2025)"
  venue: |
    Originally played at *Manning Bowl* (capacity ~20,000, opened 1937
    as Municipal Stadium, renamed for Mayor J. Fred Manning in 1938).
    The Bowl closed after the 2004 Thanksgiving game and was demolished
    in 2005. Replaced by *Manning Field* on the same site — both teams
    share the home field, so "there is no away team."
  notes: |
    Originally East-Lynn vs West-Lynn — a geographic district split down
    Washington Street. Since 1990s school choice, the rivalry is more
    about identity than catchment.

# ---------------------------------------------------------------------------
# Manning Bowl / Manning Field — the venue that *is* Lynn HS football.
# ---------------------------------------------------------------------------
venues:
  - name: "Manning Bowl (1937–2004) / Manning Field (2005–present)"
    image: "manning-bowl.jpg"
    image_caption: |
      Manning Stadium (later Manning Bowl), Lynn, MA — vintage aerial
      postcard, c. 1940s. Source: Boston Public Library / Wikimedia
      Commons (public domain).
    capacity_orig: 21000
    architect: "Cyril Harding"
    cost: "$500,000 (~$11.2M in 2025 dollars)"
    history: |
      **Manning Bowl** broke ground in September 1936 as a Works
      Progress Administration project, and opened on **November 24,
      1937** for the LEHS / Classical Thanksgiving game while still
      under construction (then called *Municipal Stadium*). It was
      formally completed on **June 21, 1938** and dedicated to Mayor
      J. Fred Manning. A 21,000-seat amphitheater designed by Cyril
      Harding; total construction cost was about $500,000 (≈ $11.2M
      in 2025 dollars).

      **Football firsts and lasts**
      The first touchdown ever scored at the Bowl was by **Henry Pazik**
      (LEHS) — a 33-yard pass from QB Joe McNulty in the opening 1937
      Thanksgiving game (LEHS 13, Classical 6). The last touchdown was
      also a Bulldog: **Mike Orfanos** on a 2-yard run in the 2004
      closer, LEHS 28-8. In between, the Bowl hosted the *Harry Agganis
      All-Star Football Classic* (1956–59 and 1965–2003) and the very
      first **televised high school football game** in Massachusetts,
      a 1948 WNAC-TV broadcast.

      **Bigger-stage moments**
      * Sep 18, 1945 — **Boston Yanks** (NFL) beat the **NY Giants**
        14-3 in front of 8,500 fans
      * Sep 26, 1953 — **Holy Cross beat Dartmouth 28-7**, nationally
        televised to an estimated 80 million viewers
      * 1959 — Chicago Bears defeated Philadelphia Eagles 24-21
        (Cardinal Cushing Charity Game)
      * 1966–1982 — host of the **Drum & Bugle Corps World Open
        Championship**

      **Rock concerts (1966–1985)**
      The Bowl had a brief, wild run as a major concert venue:
      * Jun 24, 1966 — **The Rolling Stones** kicked off their North
        American tour here; police cut the show short due to a crowd
        surge
      * Jul 11, 1976 — **Ray Charles** charity show (with Four Tops,
        Dorothy Moore)
      * Sep 23, 1984 — **Beach Boys**
      * Aug 3, 1985 — **Mötley Crüe** drew ~15,000 (with Accept, Y&T)
      * Sep 8, 1985 — **The Kinks**, ~7,000
      * Sep 14, 1985 — **Aerosmith** drew ~25,000; the show resulted
        in a traffic jam and 12 arrests, prompting Lynn city council
        to ban rock concerts at the Bowl 11 days later

      **Closed and replaced**
      Renovated in 1974, closed after the 2004 Thanksgiving game, and
      demolished in 2005. **Manning Field** opened on the same site
      that year as the shared home field for Lynn English, Lynn
      Classical, Lynn Tech, and St. Mary's.

      A nice generational note: Henry Pazik's son, **Mike Pazik** (also
      LEHS, also a quarterback, also a Hall-of-Famer — Class of 2019),
      went on to pitch in MLB with the Minnesota Twins.

# ---------------------------------------------------------------------------
# Current athletic director.
# ---------------------------------------------------------------------------
athletic_director:
  name: "Ashley Aldred"
  since: "July 2025"
  historic_note: "First female Athletic Director in the City of Lynn."
  bio: |
    Arlington, MA native who played college softball at Salem State.
    Joined LEHS as varsity softball head coach in 2019; coached the
    English-Classical powderpuff game in fall 2024. Named *The Item*'s
    Coach of the Year in 2023 after leading the Bulldogs softball team
    to their first postseason appearance since 1999 — finishing the
    regular season on a six-game win streak after a 4-9 start.
  replaced: |
    Dick Newton, who served as AD from 2016 until his retirement in
    June 2025.

# ---------------------------------------------------------------------------
# Current head coaches (in addition to the AD).
# ---------------------------------------------------------------------------
current_coaches:
  - name: "Tyllor McDonald"
    sport: "Football"
    since: "2024"
    bio: |
      Second-year head coach in 2025; former quarterback. Led the
      Bulldogs to a **9-2** season — best at LEHS in a decade — winning
      nine straight after an 0-2 start, capturing the **2025 GBL
      Championship** outright (32-22 over Somerville) and closing the
      season 36-12 over Lynn Classical on Thanksgiving. Named *The
      Item*'s Fall 2025 Coach of the Year.

  - name: "Dina Wavezwa"
    sport: "Boys Basketball"
    since: "April 2025"
    bio: |
      LEHS class of **1992**; grew up in the Meadows neighborhood
      across the street from the school. Was an assistant on **Antonio
      Anderson**'s 2019-20 back-to-back MA Division 1 state-championship
      staff, and later an assistant at Lynn Classical. Replaced Alvin
      Abreu (stepped down March 2025).

  - name: "Stephanie Vasquez"
    sport: "Girls Basketball"
    since: "2026"
    bio: |
      Coaching stops at St. Mary's Middle School, KIPP Academy, Lynn
      English (previously under Rachael Bradley in 2014), Essex Tech,
      and Salem State. Played at St. Mary's (7th grade through
      sophomore — varsity as an 8th grader) before transferring to
      Salem High (Class of 2007). Replaces Sydney Brennan; takes over
      a Bulldogs team coming off a 2-16 season.

  - name: "Ashley Aldred"
    sport: "Softball"
    since: "2019"
    bio: |
      Now also Athletic Director (see above). 2023 *Item* Coach of the
      Year — broke a 24-year postseason drought.

  - name: "Dan Koziski"
    sport: "Wrestling (Lynn co-op)"
    since: ""
    bio: |
      Head coach of the Lynn wrestling co-op — a combined program
      drawing athletes from all four city programs (Lynn English,
      Classical, Tech, and St. Mary's).

