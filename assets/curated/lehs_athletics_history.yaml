# ---------------------------------------------------------------------------
# Coaches who've moved on but defined an era.
# ---------------------------------------------------------------------------
legacy_coaches:
  - name: "Antonio Anderson"
    sport: "Boys Basketball"
    years: "2017–2021 (four seasons)"
    highlights: |
      Head coach of the back-to-back MA Division 1 state champion
      Bulldogs in 2019 and 2020. Stepped down March 2021 after winning
      the GBL title in his farewell game (over Everett). Younger
      brother of LEHS HoF inductee Anthony Anderson; played at Memphis
      under John Calipari (C-USA Defensive Player of the Year 2009),
      then 10-day NBA contracts with the OKC Thunder in 2010 and the
      NBA D-League. Several of his LEHS assistants stayed in the
      program — Dina Wavezwa, the current head coach, was one of them.

  - name: "Ronald (Ron) Bennett"
    sport: "Boys Basketball + Baseball"
    years: "35+ years at LEHS"
    highlights: |
      One of LEHS's all-time-winningest coaches across both sports —
      **700+ coaching wins**. Head coach of the 2000 Anthony Anderson
      team; called Anderson "in 35 years, the best player I've ever
      had." Inducted into the LEHS Hall of Fame in the 2013 class.

  - name: "Alvin Abreu"
    sport: "Boys Basketball"
    years: "post-Anderson — March 2025"
    highlights: "Stepped down in March 2025; replaced by Dina Wavezwa."

  - name: "SgtMaj (ret.) Kenneth Oswald, USMC"
    sport: "Marine Corps JROTC"
    years: "1995–2021 (26 years)"
    highlights: |
      Three National All-Service Drill Team championships, 21
      consecutive Naval Honor School Awards. HoF Class of 2024.

  - name: "Dick Newton"
    sport: "Athletic Director (also Football + Baseball player)"
    years: "AD 2016 – June 2025"
    highlights: |
      An LEHS lifer — played football and baseball at the school
      himself, inducted into the LEHS Hall of Fame as a player in the
      2013 class, then returned as Director of Athletics for nearly a
      decade (2016–2025). Retired June 2025; Ashley Aldred succeeded
      him the next month, making history as Lynn's first female AD.

  - name: "Tom Whelan"
    sport: "Principal / Athletic Director (also MLB)"
    years: "1940s–1950s"
    highlights: |
      Two-sport pro (MLB Boston Braves infielder 1920, Canton Bulldogs
      football alongside Jim Thorpe 1919–1920) who returned to LEHS as
      teacher, baseball coach, AD, and ultimately principal. The
      Whelan Family Scholarship at LEHS is named in his honor.

# ---------------------------------------------------------------------------
# Notable alumni.
# ---------------------------------------------------------------------------
notable_alumni:
  # Basketball — the Anderson brothers are the most decorated 2000s era story.
  - name: "Anthony Anderson"
    grad_year: "2000"
    sport: "Basketball"
    bio: |
      LEHS HoF Class of 2024. Boston Globe All-Scholastic 2000; NEC
      MVP as a junior and senior; senior averages of 24 points / 10
      assists / 9 rebounds led the Bulldogs to a 19-5 record. Played
      at **UMass Amherst** 2001–2005, finishing as the program's
      second-best all-time three-point shooter (275 made threes);
      named Atlantic 10 Rookie of the Year in 2002. Pro: played in
      the ABA, PBL, and NBL Canada — became the NBL Canada all-time
      leading scorer and won the 2014 league MVP. Older brother of
      Antonio Anderson.
  - name: "Antonio Anderson"
    sport: "Basketball"
    bio: |
      Started high school at LEHS before transferring to Lynn Tech,
      where he won a MA Division 3 state title as a junior in 2002
      under coach Marvin Avery. Played at **Memphis** under John
      Calipari; **Conference USA Defensive Player of the Year 2009**.
      Signed multiple 10-day contracts with the Oklahoma City Thunder
      in 2010, played in the NBA D-League. Returned home as LEHS
      boys-basketball head coach 2017–2021 — back-to-back state titles
      2019 + 2020.

  # Major League Baseball
  - name: "Bump Hadley"
    grad_year: "1920s"
    sport: "Baseball (MLB)"
    bio: |
      Right-handed pitcher; 16 MLB seasons (1926–1941). Won three World
      Series with the New York Yankees in the 1930s. Pitched for the
      Senators, White Sox, Browns, Yankees, Giants, and Athletics.
  - name: "Jim Hegan"
    grad_year: "1938"
    sport: "Baseball (MLB) / Football (HS QB)"
    bio: |
      Played quarterback at LEHS during the early Manning Bowl years.
      **17-year MLB career as a catcher** (1941–1960): 1,666 games,
      mostly with the Cleveland Indians (14 yrs) plus shorter stints
      with Detroit, the Phillies, Cubs, and SF Giants. **Five-time
      All-Star** (1947, 1949, 1950, 1951, 1952). **1948 World Series
      champion** with Cleveland. Widely considered one of the best
      defensive catchers of his era — caught 4 no-hitters. Later a
      long-tenured **New York Yankees coach**, where his son Mike
      Hegan also played.
  - name: "Henry Pazik"
    sport: "Football"
    bio: |
      Scored the **first touchdown ever** at Manning Bowl on Nov 24,
      1937 — a 33-yard pass from QB Joe McNulty in LEHS's 13-6
      Thanksgiving win over Classical. Father of MLB pitcher Mike Pazik.
  - name: "Mike Pazik"
    sport: "Baseball (MLB) / Football (HS QB)"
    bio: |
      Quarterback at LEHS like his father Henry. Pitcher with the
      Minnesota Twins in the mid-1970s.
  - name: "Les Burke"
    sport: "Baseball (MLB)"
    bio: |
      Infielder; Detroit Tigers, 1920s.
  - name: "Tom Whelan"
    sport: "Baseball (MLB) + Football"
    bio: |
      Infielder for the Boston Braves (1920) — one of the country's
      first two-sport pros. Played on the World-Championship Canton
      Bulldogs alongside Jim Thorpe in 1919 and 1920. Returned to LEHS
      as teacher, baseball coach, AD, and principal during the
      1940s–50s. The Whelan Family Scholarship honors his legacy.
  - name: "Ben Bowden"
    grad_year: "2013"
    sport: "Baseball (MLB)"
    bio: |
      Left-handed pitcher; 6'4", 215 lbs as a HS senior (dropped 40
      lbs from 252 over the prior off-season). At LEHS: threw a
      **perfect game vs Marblehead** in his 2012 season opener; 82
      strikeouts in 51.2 IP that year; opened his 2013 senior
      campaign with **15 K, 2 hits, 1 unearned run vs Salem** in a
      7-1 win. Named to ESPNBoston's **All-State Starting Rotation
      Team in 2012**. Committed to Vanderbilt; reached the majors
      with the **Colorado Rockies in 2021**.

  # Music
  - name: "Sib Hashian"
    sport: "Music"
    bio: |
      Drummer for the rock band *Boston* — performed on the band's
      self-titled 1976 debut, one of the best-selling debut albums of
      all time.

  # Acting
  - name: "Jack Noseworthy"
    grad_year: "1982"
    sport: "Acting"
    bio: |
      Film and TV actor — *Event Horizon*, *S.W.A.T.*, *Killing
      Kennedy*, Broadway and off-Broadway credits.

  # Academia + civic
  - name: "John A. Curry"
    grad_year: "1951"
    sport: "Higher Education"
    bio: "Served as president of Northeastern University."
  - name: "John J. Donovan"
    grad_year: "1959"
    sport: "Academia / Tech"
    bio: |
      MIT professor and entrepreneur; founder of multiple software
      companies in the Cambridge tech ecosystem.

  # Controversial / political — included for historical completeness
  - name: "Lyndon LaRouche"
    grad_year: "1940"
    sport: "Politics / Economics"
    bio: |
      Political activist and perennial U.S. presidential candidate
      (eight runs, 1976–2004). Founder of the LaRouche movement.
      Polarizing figure — listed here as a matter of historical record.
