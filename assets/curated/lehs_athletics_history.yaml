championships:
  - year: 2025
    sport: "Football"
    level: "Greater Boston League Champions"
    coach: "Tyllor McDonald"
    record: "9-2"
    notes: |
      Beat Somerville 32-22 for the outright GBL title — Lynn English's
      best football season in a decade. Won nine straight after starting
      0-2, capped by a 36-12 Thanksgiving win over Lynn Classical.
      Shane Knowlton-Simard (QB/DB, '26) named GBL MVP.
  - year: 2024
    sport: "Football"
    level: "Greater Boston League Co-Champions"
    notes: "Tied with Medford for the GBL title in McDonald's first season."
  - year: 2020
    sport: "Boys Basketball"
    level: "Massachusetts Division 1 State Champions"
    coach: "Antonio Anderson"
    notes: "Back-to-back state titles (2019, 2020) — a Bulldogs program peak."
  - year: 2019
    sport: "Boys Basketball"
    level: "Massachusetts Division 1 State Champions"
    coach: "Antonio Anderson"
    notes: "First of back-to-back D1 titles."
  - year: 2017
    sport: "Marine Corps JROTC Drill Team"
    level: "National Champions"
    notes: |
      Repeatedly voted the #1 JROTC program in its region — three times
      since 2000 as of fall 2019. Drill team competition, not MIAA, but
      a championship the school carries with pride.

