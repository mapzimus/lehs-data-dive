# ---------------------------------------------------------------------------
# Coaches who've moved on but defined an era.
# ---------------------------------------------------------------------------
legacy_coaches:
  - name: "Antonio Anderson"
    sport: "Boys Basketball"
    years: "through ~2020"
    highlights: |
      Head coach of the back-to-back MA Division 1 state champion
      Bulldogs in 2019 and 2020. Several of his assistants (incl. Dina
      Wavezwa) have stayed in the program.
  - name: "Alvin Abreu"
    sport: "Boys Basketball"
    years: "post-Anderson — March 2025"
    highlights: "Stepped down in March 2025; replaced by Dina Wavezwa."
  - name: "Dick Newton"
    sport: "Athletic Director"
    years: "2016 – June 2025"
    highlights: |
      Director of Athletics for nearly a decade. Retired June 2025;
      Ashley Aldred succeeded him in July, making history as Lynn's
      first female AD.

# ---------------------------------------------------------------------------
# Notable alumni — primarily athletic but a few cultural / civic
# figures included where they've shaped the school's identity.
# ---------------------------------------------------------------------------
notable_alumni:
  # Major League Baseball — most documented LEHS pro-athlete pipeline.
  - name: "Bump Hadley"
    grad_year: "1920s"
    sport: "Baseball (MLB)"
    bio: |
      Right-handed pitcher; 16 MLB seasons (1926–1941). Won three World
      Series with the New York Yankees in the 1930s. One of the era's
      most well-traveled hurlers — Senators, White Sox, Browns, Yankees,
      Giants, Athletics.
  - name: "Jim Hegan"
    grad_year: "1938"
    sport: "Baseball (MLB)"
    bio: |
      Catcher; 17 MLB seasons (1941–1960), mostly with the Cleveland
      Indians. Five-time All-Star, member of the 1948 World Series
      champion Indians. Considered one of the best defensive catchers
      of his era; later a long-tenured Yankees coach.
  - name: "Les Burke"
    sport: "Baseball (MLB)"
    bio: |
      Infielder; played for the Detroit Tigers in the 1920s.
  - name: "Tom Whelan"
    sport: "Baseball (MLB) + Football"
    bio: |
      Infielder for the Boston Braves (1920). One of the country's first
      two-sport professional athletes — played on the World-Championship
      Canton Bulldogs alongside Jim Thorpe in 1919 and 1920. Later
      returned to LEHS as a teacher, baseball coach, and eventually
      headmaster.
  - name: "Mike Pazik"
    sport: "Baseball (MLB)"
    bio: |
      Pitcher; appeared for the Minnesota Twins in the mid-1970s.
  - name: "Ben Bowden"
    grad_year: "2013"
    sport: "Baseball (MLB)"
    bio: |
      Left-handed pitcher; reached the majors with the Colorado Rockies
      in 2021 after a standout career at Vanderbilt.

  # Music
  - name: "Sib Hashian"
    sport: "Music"
    bio: |
      Drummer for the rock band *Boston* — performed on the band's
      self-titled 1976 debut, one of the best-selling debut albums of
      all time. Lynn-born, LEHS-educated.

  # Acting
  - name: "Jack Noseworthy"
    grad_year: "1982"
    sport: "Acting"
    bio: |
      Film and TV actor — *Event Horizon*, *S.W.A.T.*, *Killing Kennedy*,
      Broadway and off-Broadway credits.

  # Academia + civic
  - name: "John A. Curry"
    grad_year: "1951"
    sport: "Higher Education"
    bio: |
      Served as president of Northeastern University.
  - name: "John J. Donovan"
    grad_year: "1959"
    sport: "Academia / Tech"
    bio: |
      MIT professor and entrepreneur; founder of multiple software
      companies in the Cambridge tech ecosystem.

  # Controversial / political — included for completeness
  - name: "Lyndon LaRouche"
    grad_year: "1940"
    sport: "Politics / Economics"
    bio: |
      Political activist and perennial U.S. presidential candidate
      (eight runs, 1976–2004). Founder of the LaRouche movement.
      Polarizing figure — listed here as a matter of historical record.
