# Dashboard update log — drives the RSS feed (updates/feed.xml) and changelog
# (updates/CHANGELOG.md) built by scripts/23_build_updates_feed.py.
#
# Append a new entry whenever something visitor-facing ships. Newest first.
# Fields:
#   date:   ISO date (YYYY-MM-DD)
#   title:  short headline
#   body:   one or two sentences, plain language
updates:
  - date: 2026-10-23
    title: "Lynn City numbers corrected and moved to the 2020–24 Census"
    body: >
      Several Lynn City figures were reading the wrong Census rows. Per-capita
      income is $35,598 (it had shown median family income, $86,600), the
      poverty rate is 13.8% for all residents and 17.9% for children (the two
      had been mislabeled), and the language, industry, and commute charts now
      line up with their categories. The Neighborhoods tab now has tract maps
      of income, education, language, and rent burden, and "severely
      rent-burdened" now means paying 50% or more of income on rent (33.5% of
      Lynn renters). Massachusetts comparison values are from the same 2024
      Census release.
  - date: 2026-10-21
    title: "2026 percentile ranks, 2023–24 civil-rights data, and data fixes"
    body: >
      The rank-by-indicator chart on State Accountability now uses DESE's
      2026 percentile file. Lynn English is at the 53rd percentile for
      English growth and in the single digits for achievement. Federal
      civil-rights data moves from 2021–22 to 2023–24: discipline by group,
      AP access (15 AP courses, 181 students enrolled), and support-staff
      ratios. College-enrollment trends no longer show two different values
      for 2022 and 2024, and about 2,300 duplicate state rows are gone. The
      School Profile photo caption now gives the right address, 50
      Goodridge Street.
  - date: 2026-10-05
    title: "Spring 2026 MCAS and the 2026 report card are in"
    body: >
      DESE's September 22 release is now on the dashboard. Lynn English's
      grade-10 English average scaled score rose from 472.9 to 477.5, and
      the school earned full credit on that indicator. The state rating is
      unchanged: requiring assistance, percentile 1, cumulative progress
      36% (up from 29%). End-of-year attendance for 2025–26 is in
      (chronic absenteeism 53.4%), as is advanced-course completion
      (48.8%). Class of 2026 graduation rates and October 2026 enrollment
      are not public yet. The 2026 percentile research file is not posted,
      so indicator ranks still use the 2025 build.
  - date: 2026-09-13
    title: "Clearer language on Home, About, and Stories"
    body: >
      Visitor-facing copy is shorter and more everyday. Home, About the Data,
      Stories, and page intros drop analyst jargon. Stories links now point
      at the merged pages. The Corrections tab is labeled Corrections (it
      had said Methodology). Data 101's sample enrollment table matches the
      recent drop instead of a rising trend.
  - date: 2026-09-12
    title: "FY2025 spending and mid-2026 housing now in"
    body: >
      School and district expenditure files now include FY2025 (LEHS per-pupil
      spending is in the dashboard through that year), and the Lynn housing
      series is refreshed through July 2026. Year labels on MCAS, English
      Learners, Teachers, and About the Data now follow the latest year in
      each dataset, so the next DESE release will show up without a copy
      edit. Spring 2026 MCAS, 2026 graduation rates, and 2026–27 October
      enrollment are not public yet.
  - date: 2026-08-02
    title: "2026 accountability targets now live"
    body: >
      SY2025-26 is closed. DESE's July 31 release of the 2026 Accountability
      Targets and 2027 Increments workbook is now in the dashboard — the State
      Accountability page shows the newest baselines and next-year steps for
      each indicator and student group.
  - date: 2026-06-13
    title: "New pages: Lynn HS Options, Wellbeing, Feeder Schools, and more"
    body: >
      A big additions release: a side-by-side of Lynn's public high schools, a
      student & community wellbeing page, feeder-middle-school profiles with an
      enrollment projection, a "what changed this year" overview, a data-gaps
      and corrections log, Stories, and a housing-affordability section.
  - date: 2026-06-13
    title: "Accessibility & convenience: dark mode, Spanish switcher, search, shareable links"
    body: >
      The dashboard now has a dark theme, a Spanish/English language switcher,
      site-wide search, shareable URLs that remember your filter selections, and
      a one-click School Committee PDF briefing.
  - date: 2026-06-12
    title: "State Accountability deep-dive"
    body: >
      The State Accountability page now breaks down how the determination is
      built, where LEHS sits statewide by percentile, what next year's targets
      require, and the long-run trend behind each indicator.
