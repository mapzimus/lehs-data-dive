[theme]
# Lynn English colors: navy blue + gold (school colors). This is the default
# (light) theme; users can switch to dark via the top-right ☰ → Settings →
# Theme, and charts + inline text follow automatically (see utils/charts.py
# _ThemeLayout and the theme-inheriting inline HTML).
primaryColor = "#FFB81C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4F8"
textColor = "#0A1F44"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
# Hide dev chrome (Deploy/Run/Stop, "Made with Streamlit" footer) for production.
toolbarMode = "minimal"
showSidebarNavigation = true
